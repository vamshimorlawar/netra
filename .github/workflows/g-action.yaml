name: Breach Check

on:
  push:

jobs:
  breach-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python Example
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (Python)
        run: |
          pip install -r requirements.txt

      - name: Run breach check (Python)
        run: |
          python check_breaches.py

